<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <title>NearYou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#080808',
              surface1: '#0F0F0F',
              surface2: '#161616',
              surface3: '#1E1A0F',
              gold: '#D4A843',
              goldLight: '#F0C96B',
              goldDark: '#A07820',
              textPrimary: '#F5F0E8',
              textSecondary: '#9A8F7A',
              textMuted: '#4A4035',
              success: '#4CAF82',
              error: '#C0392B',
              warning: '#E67E22',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['"Playfair Display"', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Premium scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #080808;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(212, 168, 67, 0.15);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #D4A843;
    }

    /* Gold Gradient Utility */
    .gold-gradient {
      background: linear-gradient(135deg, #A07820 0%, #D4A843 40%, #F0C96B 70%, #D4A843 100%);
    }

    /* Gold Card Style */
    .gold-card {
      background: linear-gradient(145deg, #111008, #0D0D0D);
      border: 1px solid rgba(212, 168, 67, 0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(212,168,67,0.08);
      border-radius: 24px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .gold-card-hover:hover {
      border-color: rgba(212, 168, 67, 0.3);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 25px rgba(212, 168, 67, 0.12);
      transform: translateY(-2px);
    }

    /* Gold Proximity Pulse Animation */
    @keyframes gold-proximity-pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(212, 168, 67, 0.35);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 8px rgba(212, 168, 67, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(212, 168, 67, 0);
      }
    }
    .pulse-gold-proximity {
      animation: gold-proximity-pulse 2s infinite;
    }

    /* Hero Spotlight Gradient */
    .hero-spotlight {
      background: radial-gradient(ellipse at top, rgba(212, 168, 67, 0.08) 0%, #080808 65%);
    }

    /* Tabular Numeric Pricing formatting */
    .font-mono-gold {
      font-family: 'Inter', sans-serif;
      font-variant-numeric: tabular-nums;
      color: #D4A843;
      font-weight: 700;
    }
  </style>
</head>
<body style="margin:0;background:#080808;font-family:'Inter',sans-serif;color:#F5F0E8;overflow-x:hidden;">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
